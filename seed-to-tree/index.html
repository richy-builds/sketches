<body>
<canvas id="scene" role="img" aria-label="Seen close up, a seed swells and splits, sends roots into the earth and pushes a hooked sprout through the soil. The view pulls back as it opens two seed leaves and grows into a branching tree with a sunlit green canopy, hazy hills behind, grass in front, a butterfly, and birds settling in the crown."></canvas>
<main>

  </footer>
</main>
<script>
'use strict';
const canvas = document.querySelector('canvas'), ctx = canvas.getContext('2d');
const progress = document.querySelector('#progress'), pauseButton = document.querySelector('#pause');

const duration = 26, TAU = Math.PI * 2;

const startAt = Number(new URLSearchParams(location.search).get('t')) || 0;
let w = 0, h = 0, dpr = 1, breeze = 0, last = 0, speed = 1, pointerX = 0;
let cx = 0, unit = 1, view = { left: 0, right: 0, top: 0, bottom: 0 };
let elapsed = startAt > 0 ? Math.min(1, startAt) * duration : motionPreference.matches ? duration : 0;

let seed = 47;

// ---- The tree is generated once. Every branch grows from its parent's endpoint. ----

// ---- Scene pieces ----

function drawLeaves(t) {

// Shafts of light through the canopy, angled with the sun.
function drawRays(canopy) {

    const x0 = -80 + i * 42, a = .09 * canopy * (.7 + .3 * Math.sin(breeze * .4 + i * 1.7));

function drawGrass(t) {
  const growth = .15 + .85 * ease((t - .05) / .5);
  ctx.save(); ctx.translate(-pointerX * 5, 0); ctx.lineCap = 'round';
  for (const g of grass) {
    if (g.x < view.left - 20 || g.x > view.right + 20) continue;

// A butterfly wanders over the crown once the leaves are in, resting now and then on a sunlit leaf.
function drawButterfly(t) {
  const presence = ease((t - .6) / .06); if (!presence || !butterflyPerch) return;
  const b = breeze, cycle = b % 12, perching = ease((cycle - 7.2) / .8) * (1 - ease((cycle - 11) / .8));
  const fx = 10 + 95 * Math.sin(b * .37) + 6 * Math.sin(b * 4.1), fy = -215 + 50 * Math.sin(b * .53 + 1) + 5 * Math.sin(b * 3.3);
  const vx = 95 * .37 * Math.cos(b * .37) + 6 * 4.1 * Math.cos(b * 4.1), vy = 50 * .53 * Math.cos(b * .53 + 1) + 5 * 3.3 * Math.cos(b * 3.3);
  const hf = Math.atan2(vy, vx), hx = mix(Math.cos(hf), 0, perching), hy = mix(Math.sin(hf), -1, perching);
  const x = mix(fx, butterflyPerch.x, perching), y = mix(fy, butterflyPerch.y - 1, perching);

  ctx.save(); ctx.globalAlpha = presence; ctx.translate(sway(x, y), y); ctx.rotate(Math.atan2(hy, hx)); ctx.scale(2.2, 2.2);
  ctx.lineWidth = .22; ctx.strokeStyle = '#6b5238';

    ctx.fillStyle = '#f2c96a';
    ctx.beginPath(); ctx.ellipse(.5, s * 2.1 * flap, 2.5, 1.9 * flap, s * .35, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(-1.4, s * 1.7 * flap, 1.9, 1.4 * flap, -s * .3, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#6b5238'; ctx.beginPath(); ctx.ellipse(1.4, s * 2.7 * flap, .5, .4 * flap, 0, 0, TAU); ctx.fill();

  ctx.lineWidth = .2; ctx.beginPath(); ctx.moveTo(2, 0); ctx.lineTo(3.3, -.9); ctx.moveTo(2, 0); ctx.lineTo(3.3, .9); ctx.stroke();

function drawBird(x, y, s, flying, flap, headTurn, tailFlick) {
  ctx.save(); ctx.translate(sway(x, y), y); ctx.scale(s * 1.4, 1.4); ctx.lineCap = 'round';
  if (flying) {
    ctx.fillStyle = '#3f4a3c'; ctx.beginPath(); ctx.ellipse(0, 0, 4, 1.9, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#3f4a3c'; ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.moveTo(.5, -.5); ctx.quadraticCurveTo(-1, -1 - 3 * flap, -3.5, -.5 - 6.5 * flap); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(.5, -.5); ctx.quadraticCurveTo(2.5, -1 - 2.5 * flap, 4.5, -.5 - 5 * flap); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-3.5, 0); ctx.lineTo(-6, .8); ctx.stroke();
  } else {
    ctx.strokeStyle = '#4a3d2a'; ctx.lineWidth = .6; ctx.beginPath(); ctx.moveTo(-.8, 2.6); ctx.lineTo(-.8, 4); ctx.moveTo(.8, 2.6); ctx.lineTo(.8, 4); ctx.stroke();
    ctx.strokeStyle = '#3f4a3c'; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(-3.6, .6); ctx.lineTo(-7.2, 2.2 - tailFlick * 2.5); ctx.stroke();
    ctx.fillStyle = '#3f4a3c'; ctx.beginPath(); ctx.ellipse(0, 0, 4.4, 2.9, -.3, 0, TAU); ctx.fill();
    ctx.fillStyle = '#c98a5a'; ctx.beginPath(); ctx.ellipse(1.2, .9, 2.6, 1.9, -.2, 0, TAU); ctx.fill();
    const hx = 3.4 + headTurn * .6;
    ctx.fillStyle = '#3f4a3c'; ctx.beginPath(); ctx.arc(hx, -2.6, 2.2, 0, TAU); ctx.fill();
    ctx.fillStyle = '#d9a441'; ctx.beginPath(); ctx.moveTo(hx + 1.8, -2.9); ctx.lineTo(hx + 3.8 + headTurn * .8, -2.2); ctx.lineTo(hx + 1.8, -1.7); ctx.closePath(); ctx.fill();

// Three birds fly in from the left as the canopy completes and settle on the upper branches.
function drawBirds(t) {
  for (const bird of birds) {
    const f = (t - bird.arrive) / .05; if (f <= 0) continue;
    const flap = .5 + .5 * Math.sin(breeze * 14 + bird.phase);
    if (f < 1) {
      const k = ease(f), mx = mix(bird.from.x, bird.x, .5), my = Math.min(bird.from.y, bird.y) - 60;
      drawBird((1-k)*(1-k)*bird.from.x + 2*(1-k)*k*mx + k*k*bird.x, (1-k)*(1-k)*bird.from.y + 2*(1-k)*k*my + k*k*bird.y, 1, true, flap, 0, 0);

function draw() {
  const t = elapsed / duration, canopy = ease((t - .5) / .4);
  ctx.clearRect(0, 0, w, h);
  const bg = ctx.createLinearGradient(0, 0, 0, h); bg.addColorStop(0, '#f6f5ea'); bg.addColorStop(.64, '#e9eddf'); bg.addColorStop(1, '#e2e5d4'); ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);

  const cam = camera(t), scale = unit * cam.zoom, groundY = cam.anchorY * h - cam.lookY * scale;
  view = { left: cam.lookX - cx / scale, right: cam.lookX + (w - cx) / scale, top: -groundY / scale, bottom: (h - groundY) / scale };

  ctx.save(); ctx.translate(cx - cam.lookX * scale, groundY); ctx.scale(scale, scale);

  drawTree(t, path, grown, hook);
  drawCotyledons(t, path, grown);
  drawCrumbs(t);
  drawLeaves(t);
  drawRays(canopy);
  drawBirds(t);
  drawButterfly(t);
  drawGrass(t);

    ctx.beginPath(); ctx.arc(x, y, m.size, 0, TAU); ctx.fillStyle = '#fffff3a0'; ctx.fill();
  }

  percentLabel.textContent = Math.round(t * 100) + '%';
  const stage = t < .04 ? '01 / The seed' : t < .125 ? '02 / Taking root' : t < .3 ? '03 / Breaking ground' : t < .55 ? '04 / Reaching up' : t < .86 ? '05 / Unfolding' : '06 / A tree, at last';

function resize() { w = innerWidth; h = innerHeight; dpr = Math.min(devicePixelRatio || 1, 2); canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); draw(); }

document.querySelector('#replay').addEventListener('click', () => { elapsed = 0; paused = false; updatePause(); draw(); });
pauseButton.addEventListener('click', () => { paused = !paused; updatePause(); });
document.querySelector('#speed').addEventListener('click', event => { speed = speed === 1 ? 2 : speed === 2 ? .5 : 1; event.currentTarget.textContent = speed + '× speed'; event.currentTarget.setAttribute('aria-label', 'Playback speed: ' + speed + ' times'); });
progress.addEventListener('input', () => { elapsed = Number(progress.value) / 1000 * duration; draw(); });
addEventListener('pointermove', event => { pointerX = event.clientX / w - .5; });
addEventListener('resize', resize);
motionPreference.addEventListener('change', event => { paused = event.matches; if (paused) elapsed = duration; updatePause(); draw(); });
updatePause(); resize(); requestAnimationFrame(frame);
</script>
